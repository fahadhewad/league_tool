spring:
  application:
    name: leaguetool-backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # We use Redis only for caching + the rate limiter, not Spring Data Redis repositories.
      repositories:
        enabled: false
  datasource:
    # Postgres is the default store (infra/docker-compose provides one). The schema is owned by
    # Flyway migrations, so Hibernate only validates it. The `test` profile swaps in H2.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leaguetool}
    username: ${SPRING_DATASOURCE_USERNAME:leaguetool}
    password: ${SPRING_DATASOURCE_PASSWORD:leaguetool}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

app:
  redis:
    # false: in-process rate limiter + Caffeine cache (fine for a single instance, the default).
    # true: Redis-backed distributed limiter + shared cache, so multiple instances share one Riot
    # budget and cache. Requires the Redis at spring.data.redis.* (infra/docker-compose has one).
    enabled: ${REDIS_ENABLED:false}

admin:
  # Shared secret required (in the X-Admin-Token header) to call /api/v1/admin/** (crawler,
  # static-data refresh). Left blank, the admin surface is DISABLED (fail-closed). Set in prod.
  api-token: ${ADMIN_API_TOKEN:}
  header-name: ${ADMIN_HEADER_NAME:X-Admin-Token}

riot:
  api:
    key: ${RIOT_API_KEY:}
    default-platform: ${RIOT_DEFAULT_PLATFORM:euw1}
    base-url-template: "https://%s.api.riotgames.com"
    timeout-ms: 8000
    rate-limit:
      requests-per-second: 20
      requests-per-two-minutes: 100
    retry:
      max-attempts: 3
      backoff-ms: 1000
      max-backoff-ms: 20000

champion:
  datadragon:
    base-url: ${DDRAGON_BASE_URL:https://ddragon.leagueoflegends.com}
    locale: ${DDRAGON_LOCALE:en_US}
    # The bundled seed is already a full, current roster, so a network refresh is opt-in. Set true
    # to pull the latest patch's champions at boot (best-effort; falls back to the seed on failure).
    refresh-on-startup: ${DDRAGON_REFRESH_ON_STARTUP:false}
    timeout-ms: 8000

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      # Only probe Redis when we actually use it, so a single-instance (no-Redis) deploy stays UP.
      enabled: ${REDIS_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    gg.leaguetool: INFO

services:
  postgres:
    image: postgres:16-alpine
    container_name: leaguetool-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaguetool}
      POSTGRES_USER: ${POSTGRES_USER:-leaguetool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaguetool}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaguetool} -d ${POSTGRES_DB:-leaguetool}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leaguetool-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
